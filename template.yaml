AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  elyoxe-football (name pending): a poller Lambda writes JSON snapshots to a private S3 bucket every
  minute; CloudFront serves them (default *.cloudfront.net domain until the brand is chosen).
  No per-visitor compute. Same region as cinema/cards (ap-south-1).

Parameters:
  PriceClass:
    Type: String
    Default: PriceClass_200      # includes the Middle East edge locations (Dubai, Fujairah)

Globals:
  Function:
    Runtime: python3.13
    Architectures: [arm64]       # deploy.sh installs aarch64 wheels; the build machine is the Fold (aarch64)

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub elyoxe-football-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      Tags: [{Key: product, Value: elyoxe-football}]

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Statement:
          - Sid: CloudFrontReadsPublicPrefixOnly     # state/ (poller state, ledgers) is never reachable
            Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub "${DataBucket.Arn}/v1/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub elyoxe-football-oac-${AWS::Region}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Honour the Cache-Control each object carries (live.json 10 s ... cold files 1 day).
  CachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub elyoxe-football-origin-ttl-${AWS::Region}
        MinTTL: 1
        DefaultTTL: 60
        MaxTTL: 86400
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          HeadersConfig: {HeaderBehavior: none}
          CookiesConfig: {CookieBehavior: none}
          QueryStringsConfig: {QueryStringBehavior: none}

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: elyoxe-football data (name pending)
        Enabled: true
        HttpVersion: http2and3
        PriceClass: !Ref PriceClass
        Origins:
          - Id: data
            DomainName: !GetAtt DataBucket.RegionalDomainName
            OriginPath: /v1
            S3OriginConfig: {OriginAccessIdentity: ""}
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
        DefaultCacheBehavior:
          TargetOriginId: data
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true                 # .ics is stored plain; JSON is stored gzip already
          CachePolicyId: !Ref CachePolicy
          # managed "SimpleCORS": Access-Control-Allow-Origin: * so the static site can fetch cross-origin
          ResponseHeadersPolicyId: 60669652-455b-4ae9-85a4-c4c02393f86c
      Tags: [{Key: product, Value: elyoxe-football}]

  PollerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/elyoxe-football-poller
      RetentionInDays: 14

  Poller:
    Type: AWS::Serverless::Function
    DependsOn: PollerLogs
    Properties:
      FunctionName: elyoxe-football-poller
      CodeUri: build/lambda/
      Handler: poller.handler
      MemorySize: 256                    # peak 164 MB measured 2026-09-26; the work is network-bound
      Timeout: 58                        # the poller stops itself at ~50 s (settings.budget_seconds)
      ReservedConcurrentExecutions: 1    # never two pollers at once
      Environment:
        Variables:
          BUCKET: !Ref DataBucket
          ALERT_FROM: tifo@elyoxe.com      # source outage alert (poller.source_watch): one mail per outage + one on recovery
          ALERT_TO: hello@elyoxe.com
          PUSH_FUNCTION: elyoxe-football-push   # web push: one async invoke per batch of new events (push.plan)
      Policies:
        - S3CrudPolicy: {BucketName: !Ref DataBucket}
        - Statement:
            - Effect: Allow
              Action: [ses:SendEmail]
              Resource: "*"
              Condition:
                StringEquals:
                  ses:FromAddress: tifo@elyoxe.com
            - Effect: Allow
              Action: [lambda:InvokeFunction]
              Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:elyoxe-football-push"
      EventInvokeConfig:                 # an overrun minute is dropped, not queued and replayed later
        MaximumEventAgeInSeconds: 60
        MaximumRetryAttempts: 0
      Events:
        EveryMinute:
          Type: Schedule
          Properties:
            Name: elyoxe-football-every-minute
            Schedule: rate(1 minute)
            Enabled: true
            RetryPolicy:
              MaximumRetryAttempts: 0
              MaximumEventAgeInSeconds: 60
      Tags: {product: elyoxe-football}

  AnalyticsLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/elyoxe-football-analytics
      RetentionInDays: 14

  # Heavy computation on its own slow schedule, never inside the live loop: match history backfill,
  # Tifo rating, 10k-season and tournament simulations, player tables and similarity, archive.
  Analytics:
    Type: AWS::Serverless::Function
    DependsOn: AnalyticsLogs
    Properties:
      FunctionName: elyoxe-football-analytics
      CodeUri: build/lambda/
      Handler: poller.analytics_handler
      MemorySize: 512                    # CPU for the simulations; ~0.3 vCPU
      Timeout: 300
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          BUCKET: !Ref DataBucket
          ANALYTICS_BUDGET: "280"
          ALERT_FROM: tifo@elyoxe.com      # live-feed watchdog (a poller that stopped running while a match is live)
          ALERT_TO: hello@elyoxe.com
          VAPID_PUBLIC_PARAM: /elyoxe/tifo/vapid_public   # published as /v1/push.json
      Policies:
        - S3CrudPolicy: {BucketName: !Ref DataBucket}
        - Statement:
            - Effect: Allow
              Action: [ses:SendEmail]
              Resource: "*"
              Condition:
                StringEquals:
                  ses:FromAddress: tifo@elyoxe.com
            - Effect: Allow
              Action: [ssm:GetParameter]
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/elyoxe/tifo/vapid_public"
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 300
        MaximumRetryAttempts: 0
      Events:
        Every10Minutes:
          Type: Schedule
          Properties:
            Name: elyoxe-football-analytics-10min
            Schedule: rate(10 minutes)
            Enabled: true
            RetryPolicy:
              MaximumRetryAttempts: 0
              MaximumEventAgeInSeconds: 300
      Tags: {product: elyoxe-football}

  PushLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/elyoxe-football-push
      RetentionInDays: 14

  # Web push sender (owner approved the grants 2026-09-28): invoked async by the poller with new kickoff/goal/full-time
  # events; reads TIFOPUSH#<team> subscriptions from the cards table, claims each (match, event) with a conditional put,
  # sends with the VAPID key, deletes 404/410 subscriptions. No schedule, no retries (a retry could double-send).
  Push:
    Type: AWS::Serverless::Function
    DependsOn: PushLogs
    Properties:
      FunctionName: elyoxe-football-push
      CodeUri: build/lambda/
      Handler: push.handler
      MemorySize: 256
      Timeout: 300
      Environment:
        Variables:
          PUSH_TABLE: cards
          VAPID_PRIVATE_PARAM: /elyoxe/tifo/vapid_private
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:Query, dynamodb:PutItem, dynamodb:DeleteItem]
              Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/cards"
            - Effect: Allow
              Action: [ssm:GetParameter]
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/elyoxe/tifo/vapid_private"
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 600
        MaximumRetryAttempts: 0
      Tags: {product: elyoxe-football}

  ReportLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/elyoxe-football-report
      RetentionInDays: 30

  # Private weekly accuracy report to the owner (never published): Monday 08:00 UAE.
  Report:
    Type: AWS::Serverless::Function
    DependsOn: ReportLogs
    Properties:
      FunctionName: elyoxe-football-report
      CodeUri: build/lambda/
      Handler: report.handler
      MemorySize: 256
      Timeout: 60
      Environment:
        Variables:
          BUCKET: !Ref DataBucket
          REPORT_FROM: contact@elyoxe.com
      Policies:
        - S3ReadPolicy: {BucketName: !Ref DataBucket}
        - Statement:
            - Effect: Allow
              Action: [ses:SendEmail]
              Resource: "*"
              Condition:
                StringEquals:
                  ses:FromAddress: contact@elyoxe.com
      Events:
        Weekly:
          Type: Schedule
          Properties:
            Name: elyoxe-football-report-weekly
            Schedule: cron(0 4 ? * MON *)
            Enabled: true
      Tags: {product: elyoxe-football}

Outputs:
  Bucket:
    Value: !Ref DataBucket
  DistributionId:
    Value: !Ref Distribution
  DistributionDomain:
    Value: !GetAtt Distribution.DomainName
  FunctionName:
    Value: !Ref Poller
  AnalyticsFunctionName:
    Value: !Ref Analytics

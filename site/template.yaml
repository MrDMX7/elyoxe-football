AWSTemplateFormatVersion: "2010-09-09"
Description: >
  تيفو site (tifo.elyoxe.com): private S3 bucket for the static pages + one CloudFront distribution.
  Default behaviour -> the site bucket (index.html rewrite); /v1/* -> the data distribution of stack elyoxe-football
  (a function strips /v1), so pages and data share one origin (no CORS). No custom domain until the owner approves the preview.

Parameters:
  DataDomain:
    Type: String
    Default: d1n5aqaqkowltp.cloudfront.net
  Aliases:
    Type: CommaDelimitedList
    Default: ""
  CertArn:
    Type: String
    Default: ""
  ApiDomain:
    Type: String
    Default: 5cz397q2l4.execute-api.ap-south-1.amazonaws.com
  ApiOriginKey:
    Type: String
    NoEcho: true
    Default: ""

Conditions:
  HasDomain: !Not [!Equals [!Ref CertArn, ""]]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub elyoxe-tifo-site-${AWS::AccountId}
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }

  OAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig: { Name: !Sub "tifo-site-oac-${AWS::StackName}", OriginAccessControlOriginType: s3, SigningBehavior: always, SigningProtocol: sigv4 }

  IndexRewrite:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-index"
      AutoPublish: true
      FunctionConfig: { Comment: "dir -> dir/index.html", Runtime: cloudfront-js-2.0 }
      FunctionCode: |
        function handler(event) {
          var r = event.request, u = r.uri;
          if (u.endsWith("/")) r.uri = u + "index.html";
          else if (u.lastIndexOf(".") < u.lastIndexOf("/")) {
            return { statusCode: 301, statusDescription: "Moved", headers: { location: { value: u + "/" } } };
          }
          return r;
        }

  # The API's per-IP limits (saas/cards client_ip: x-viewer-ip first) need the viewer's address. The managed
  # AllViewerExceptHostHeader policy forwards viewer headers only, not CloudFront-Viewer-Address, and X-Forwarded-For's first
  # entry is whatever the client wrote; this sets the real address, overwriting a header of that name from the client
  # (the cards distribution does the same, elyoxe-cards-viewer-ip). Predictions (2026-10-06) limit registrations and
  # recovery-code guesses per address.
  ViewerIp:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-viewer-ip"
      AutoPublish: true
      FunctionConfig: { Comment: "real viewer ip for the API's rate limits", Runtime: cloudfront-js-2.0 }
      FunctionCode: |
        function handler(event) {
          event.request.headers['x-viewer-ip'] = { value: event.viewer.ip };
          return event.request;
        }

  StripV1:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-v1"
      AutoPublish: true
      FunctionConfig: { Comment: "/v1/x -> /x on the data distribution", Runtime: cloudfront-js-2.0 }
      FunctionCode: |
        function handler(event) { var r = event.request; r.uri = r.uri.replace(/^\/v1/, ""); return r; }

  # /api/tifo/match?id= (saas/cards src/tifo_match.py, any match live): cached on the id for as long as the Lambda's
  # Cache-Control says (20 s live ... 1 h finished), so one FotMob request serves every viewer of a match
  ApiMatchCache:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-api-match"
        Comment: "/api/tifo/match: origin max-age, keyed on ?id"
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 3600
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          HeadersConfig: { HeaderBehavior: none }
          CookiesConfig: { CookieBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: whitelist, QueryStrings: [id] }
  # /api/tifo/fans/tiles?match= (saas/cards src/tifo_fans.py, «اصنع التيفو»): every page of a live match asks every 20 s;
  # the Lambda says max-age=10, so each edge location asks it once in that time whatever the crowd
  ApiFansCache:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-api-fans"
        Comment: "/api/tifo/fans/tiles: origin max-age, keyed on ?match"
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 60
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          HeadersConfig: { HeaderBehavior: none }
          CookiesConfig: { CookieBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: whitelist, QueryStrings: [match] }

  # 2026-10-09: elyoxe.com's portal reads /v1/live.json from the browser (its Tifo square's live count, every minute).
  # elyoxe.com only, GET/HEAD only; Tifo's own pages are same-origin and never see the header
  V1Cors:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: tifo-v1-cors-elyoxe
        CorsConfig:
          AccessControlAllowOrigins: { Items: ["https://elyoxe.com"] }
          AccessControlAllowMethods: { Items: [GET, HEAD] }
          AccessControlAllowHeaders: { Items: ["*"] }
          AccessControlAllowCredentials: false
          AccessControlMaxAgeSec: 3600
          OriginOverride: false

  Dist:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: tifo site
        HttpVersion: http2and3
        PriceClass: PriceClass_All
        DefaultRootObject: index.html
        Aliases: !If [HasDomain, !Ref Aliases, !Ref "AWS::NoValue"]
        ViewerCertificate: !If
          - HasDomain
          - { AcmCertificateArn: !Ref CertArn, SslSupportMethod: sni-only, MinimumProtocolVersion: TLSv1.2_2021 }
          - { CloudFrontDefaultCertificate: true }
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OAC.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
          - Id: data
            DomainName: !Ref DataDomain
            CustomOriginConfig: { OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2] }
          - Id: api
            DomainName: !Ref ApiDomain
            CustomOriginConfig: { OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2] }
            OriginCustomHeaders: [{ HeaderName: X-Origin-Key, HeaderValue: !Ref ApiOriginKey }]
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # Managed-CachingOptimized (honours origin max-age)
          FunctionAssociations: [{ EventType: viewer-request, FunctionARN: !GetAtt IndexRewrite.FunctionMetadata.FunctionARN }]
        CacheBehaviors:
          - PathPattern: /api/tifo/match              # before /api/tifo/*: the only cached API path
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            CachePolicyId: !Ref ApiMatchCache
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac   # Managed-AllViewerExceptHostHeader
            FunctionAssociations: [{ EventType: viewer-request, FunctionARN: !GetAtt ViewerIp.FunctionMetadata.FunctionARN }]
          - PathPattern: /api/tifo/fans/tiles         # «اصنع التيفو»'s counts, before /api/tifo/*: cached 10 s
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            CachePolicyId: !Ref ApiFansCache
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac   # Managed-AllViewerExceptHostHeader
            FunctionAssociations: [{ EventType: viewer-request, FunctionARN: !GetAtt ViewerIp.FunctionMetadata.FunctionARN }]
          - PathPattern: /api/tifo/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad          # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac   # Managed-AllViewerExceptHostHeader
            FunctionAssociations: [{ EventType: viewer-request, FunctionARN: !GetAtt ViewerIp.FunctionMetadata.FunctionARN }]
          - PathPattern: /v1/*
            TargetOriginId: data
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # Managed-CachingOptimized: no Host header forwarded (the data distribution needs its own Host); origin max-age still honoured
            FunctionAssociations: [{ EventType: viewer-request, FunctionARN: !GetAtt StripV1.FunctionMetadata.FunctionARN }]
            ResponseHeadersPolicyId: !Ref V1Cors
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 60 }
          - { ErrorCode: 404, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 60 }

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition: { StringEquals: { "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Dist}" } }

Outputs:
  Bucket: { Value: !Ref SiteBucket }
  DistributionId: { Value: !Ref Dist }
  DistributionDomain: { Value: !GetAtt Dist.DomainName }

# Tifo news sources (owner 2026-09-30: «آلية تجيب أحدث الأخبار من كل مكان»). One entry per source; a reader per kind.
# Checked with news/tools/probe_feeds.py on 2026-09-30 (items, freshness); dead or stale candidates are listed at the end.
#
#   key    stable id (stored with every item)
#   kind   rss | gnews (Google News search RSS; one query per entity, rotated) | youtube (channel feed) | x (Fold browser, later)
#   lang   ar | en | es | fr | de | it
#   tier   official > journalist > paper > aggregator (what a story's reliability shows)
#   name   the outlet's name as the site prints it

sources:
  - {key: bbc, kind: rss, lang: en, tier: paper, name: BBC Sport, url: "https://feeds.bbci.co.uk/sport/football/rss.xml"}
  - {key: guardian, kind: rss, lang: en, tier: paper, name: The Guardian, url: "https://www.theguardian.com/football/rss"}
  - {key: sky, kind: rss, lang: en, tier: paper, name: Sky Sports, url: "https://www.skysports.com/rss/12040"}
  - {key: espn, kind: rss, lang: en, tier: paper, name: ESPN, url: "https://www.espn.com/espn/rss/soccer/news"}
  - {key: marca, kind: rss, lang: es, tier: paper, name: Marca, url: "https://e00-marca.uecdn.es/rss/futbol/primera-division.xml"}
  - {key: marca_fichajes, kind: rss, lang: es, tier: paper, name: Marca, url: "https://e00-marca.uecdn.es/rss/futbol/mercado-fichajes.xml"}
  - {key: as, kind: rss, lang: es, tier: paper, name: AS, url: "https://feeds.as.com/mrss-s/pages/as/site/as.com/section/futbol/portada/"}
  - {key: mundodeportivo, kind: rss, lang: es, tier: paper, name: Mundo Deportivo, url: "https://www.mundodeportivo.com/rss/futbol.xml"}
  - {key: lequipe, kind: rss, lang: fr, tier: paper, name: L'Équipe, url: "https://dwh.lequipe.fr/api/edito/rss?path=/Football/"}
  - {key: kicker, kind: rss, lang: de, tier: paper, name: kicker, url: "https://newsfeed.kicker.de/news/fussball"}
  - {key: skynewsarabia, kind: rss, lang: ar, tier: paper, name: سكاي نيوز عربية, url: "https://www.skynewsarabia.com/rss/sport.xml"}


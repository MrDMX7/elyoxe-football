# Google News in Arabic, one query per entity: the Arabic and UAE press (البيان، الإمارات اليوم، الاتحاد…) without a feed of
# their own. `run.py` asks a rotating slice each run (gnews_per_run), so every query comes round about hourly.
gnews:
  lang: ar
  params: {hl: ar, gl: AE, ceid: "AE:ar"}
  per_run: 12
  queries:
    - دوري أدنوك للمحترفين
    - منتخب الإمارات
    - العين
    - الشارقة
    - الوحدة الإماراتي
    - الجزيرة الإماراتي
    - شباب الأهلي
    - الوصل
    - النصر الإماراتي
    - دوري روشن
    - الهلال السعودي
    - النصر السعودي
    - الاتحاد السعودي
    - الأهلي السعودي
    - الأهلي المصري
    - الزمالك
    - منتخب السعودية
    - منتخب مصر
    - منتخب المغرب
    - كأس الخليج
    - ريال مدريد
    - برشلونة
    - مانشستر سيتي
    - ليفربول
    - مانشستر يونايتد
    - أرسنال
    - تشيلسي
    - بايرن ميونخ
    - باريس سان جيرمان
    - يوفنتوس
    - إنتر ميلان
    - ميسي
    - كريستيانو رونالدو
    - محمد صلاح
    - مبابي
    - هالاند
    - لامين يامال
    - انتقالات
    - فابريزيو رومانو

settings:
  keep_items_days: 5        # raw items kept in state (for clustering and dedupe)
  keep_clusters_days: 10
  summarize_per_run: 25     # Claude summaries per run, newest stories first
  latest_count: 150
  entity_count: 40
  social_count: 24         # videos per club / league strip, and 60 on the all-channels strip

# Not used (2026-09-30 probe): marca portada (4-day-old items; the football feeds above are fresh), sport.es (406 WAF),
# gazzetta calcio (last item 180 days old), aawsat sport (9 days old), filgoal /rss (HTML, not a feed),
# emaratalyoum / alittihad (404), alkhaleej (malformed XML), alarabiya / btolat (no DNS answer from the laptop).

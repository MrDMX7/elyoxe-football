# Every competition the poller follows. Single source of truth: ids, Arabic names, format.
# Order = priority: the heavy-refresh cursor walks this list top-down, UAE first.
#
#   id               FotMob competition id (canonical id; ids.<provider> maps other sources onto it)
#   name_ar          house-style Arabic name (FotMob's own map is in index.json as name_ar_source)
#   kind             league (round robin, table) | cup (knockout) | tournament (groups + knockout) | supercup
#   scope            uae | national | gulf | arab | asia | europe | world
#   matches_per_team league only: games each team plays in the season; FotMob publishes only the rounds
#                    already scheduled (UAE Pro League: 42 of 182), so magic numbers need this number
#   magic            false = format is not a plain round robin, skip magic numbers
#   uaepl            uaepl.ae seasonCompetitionId (official fallback for table and fixtures)
#   verified         tools/verify_competitions.py result on that date
#
# Not available anywhere: UAE First Division (not in FotMob's UAE list: 9943, 11027, 538, 11026;
# not on uaepl.ae; not on TheSportsDB/ESPN) — research/league-2026-09-26.md.

settings:
  heavy_minutes: 60          # league page (table + fixtures + leaders) per competition
  heavy_dormant_minutes: 1440  # competition with no match within 3 days back / 30 days ahead
  squads_minutes: 1440       # team pages (squad + fixtures) for focus teams
  names_minutes: 1440        # FotMob Arabic translation map
  weather_minutes: 180       # Open-Meteo, one batched request for every stadium in play
  day_idle_minutes: 10       # UAE-day scoreboard when nothing is live
  live_pass_seconds: 20      # inside one invocation while matches are live: 0 s, 20 s, 40 s
  prematch_minutes: 75       # a match is "about to kick off" this long before kickoff
  budget_seconds: 50         # hard stop for one invocation (EventBridge fires every 60 s)
  source_alert_minutes: 15   # FotMob failing this long (bad runs, neutral idle runs ignored) -> one mail to hello@; one more on recovery
  live_stall_seconds: 90      # live.json older than this while a match is live -> one mail per match (poller + analytics watchdog)
  club_squad_comps: [536, 535, 529, 524, 519, 530, 516, 544, 10721, 130, 112, 268, 114, 10195, 10196, 10198, 10199]   # W4.5: every club's team page weekly (idle minutes only)
  club_squads_per_run: 3
  club_squads_minutes: 10080
  backfill_per_run: 6        # finished-match details fetched per idle invocation until the ledger is complete
  player_stats_comps: [538, 536, 535, 529, 524, 519, 530, 516, 544, 10721, 47, 87, 55, 54, 53, 42, 130, 112, 268]   # per-player season lists (radar, similarity, foreigners): ~29 requests each, daily
  # every past season of these is fetched once (history/<id>.json): records books, Arab clubs rating
  history_comps: [538, 11027, 9943, 11026, 536, 10721, 9942, 535, 11018, 529, 524, 519, 9941, 530, 11840, 516, 544,
                  525, 10622, 9469, 9470, 526, 9468, 10474, 47, 87, 55, 54, 53, 42, 73, 10216, 78, 10703,
                  130, 112, 268, 45, 299, 44, 50, 297, 10043]
  # leagues that get the full 538 treatment (probabilities, season sim, facts, watchability, pressure, fatigue, fortress)
  analytics_leagues: [538, 536, 535, 529, 524, 519, 530, 516, 544, 10721, 47, 87, 55, 54, 53, 268]   # MLS and Argentina (groups + playoffs) wait for multi-group analytics
  # Arab clubs rating (analytics.arab_ratings): tools/calibrate_arab.py, fit before 2022-07-01, test after
  arab_rating: {k: 16, home: 60, regress: 0.2, d0: 0.30, ds: 400, newcomer: 1400, base: 1500}
  arab_rating_calibration: {brier_test: 0.5908, brier_base_rate: 0.6524, n_test: 11332, matches_total: 37575,
                            test_from: "2022-07-01", docs: docs/TIFO-RATING.md}
  records_comps: [538, 536, 535, 529, 524, 519, 530, 516, 544, 10721]
  compare_leagues: [538, 536, 535, 530, 516, 544, 524, 529, 519, 47, 87]      # league comparison (goals/match, age, foreign share, attendance)

# Tifo rating (compute/rating.py). Fitted by tools/calibrate_rating.py on 2010/11-2021/22, scored out of
# sample on 2022/23-2025/26: Brier 0.560 vs 0.653 for base rates (docs/TIFO-RATING.md).
rating: {k: 17, home: 40, regress: 0.1, d0: 0.26, ds: 350, newcomer: 1350, base: 1500,
         brier_test: 0.5599, brier_base_rate: 0.6531, n_test: 831, test_seasons: "2022/23-2025/26"}


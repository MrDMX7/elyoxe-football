# One club under two names the name rule (graph/load/teams.py) cannot see: an abbreviation or a nickname.
# [weaker source's name, FotMob's name]; the two must also be in the same country, and FotMob must have exactly that club.
same:
  - ["Sporting KC", "Sporting Kansas City"]
  - ["America Mineiro", "America MG"]
  - ["Hearts", "Heart of Midlothian"]
  - ["Odd BK", "Odds Ballklubb"]
  - ["Odd", "Odds Ballklubb"]
  - ["Junior FC", "Atletico Junior"]
  - ["Vaasa PS", "VPS"]
  - ["Aarhus", "AGF"]
  # Emirates Club (Ras Al Khaimah) still exists (FotMob 102121); teams_ar.yaml `historic` lists its old spellings only for
  # the Arabic name, and that list keeps them from the name rule: named here. Not Al Shabab, Al Ahli or Dubai (the 2017 merger).
  - ["Emirates", "Emirates Club"]
  - ["Al Emirates", "Emirates Club"]
  - ["Al-Emirates", "Emirates Club"]
  # RSSSF's names that made a second champion beside 365Scores' (2026-11-22): Al-Duhail was Lekhwiya until 2017
  - ["Lekhwiya", "Al-Duhail SC"]
  - ["IR Tanger", "Ittihad Tanger"]
  - ["Espérance de Tunis", "Esperance"]
  - ["Al Ittihad", "Al-Gharafa"]          # Qatar's Al-Ittihad took the name Al-Gharafa in 2004 (same country only)
  # {country, keys}: one old club kept twice by two weaker sources and by no FotMob record, so the name rule cannot join them.
  # keys are «source:source_id» as in xref; the lower Tifo id is kept. Never a FotMob key, never by the name rule.
  # The old Dubai CSC (until the 2017 merger into Shabab Al Ahli, which stays its own club): RSSSF's and schochastics' «Dubai».
  - {country: UAE, keys: ["rsssf-name:uae|Dubai", "sch:Dubai (United Arab Emirates)"]}
  - {country: KSA, keys: ["rsssf-name:sau|Al-Nijmeh", "sch:Al Nijmeh (Saudi Arabia)"]}
  - {country: KSA, keys: ["rsssf-name:sau|Sadous", "sch:Sadous (Saudi Arabia)"]}
  - {country: QAT, keys: ["rsssf-name:qat|Al Ittifaq", "rsssf-name:qat|Al-Ittifaq", "sch:Al Ittifaq (Qatar)"]}
  - {country: IRQ, keys: ["rsssf-name:iraq|Al-Bareed", "sch:Al Bareed (Iraq)"]}
  - {country: IRQ, keys: ["rsssf-name:iraq|Al-Jaish", "sch:Al Jaish (Iraq)"]}
  - {country: IRQ, keys: ["rsssf-name:iraq|Al-Ramadi", "sch:Al Ramadi (Iraq)"]}
  - {country: IRQ, keys: ["rsssf-name:iraq|Furat", "sch:Furat (Iraq)"]}
  - {country: IRQ, keys: ["rsssf-name:iraq|Maysan", "sch:Maysan (Iraq)"]}
  - {country: IRQ, keys: ["rsssf-name:iraq|Pires", "sch:Pires (Iraq)"]}
  - {country: IRQ, keys: ["rsssf-name:iraq|Salahaddin", "sch:Salahaddin (Iraq)"]}
  - {country: IRQ, keys: ["rsssf-name:iraq|Shatra", "sch:Shatra (Iraq)"]}
  - {country: IRQ, keys: ["rsssf-name:iraq|Sirwan (Sulimaniya)", "sch:Sirwan Sulimaniya (Iraq)"]}


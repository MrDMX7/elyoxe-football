# The tournaments whose Wikipedia pages print the organiser's man of the match under each match box (graph/motm_wiki.py).
# Each entry: a title pattern ({y} the year, {g} the group letter), the years, the groups; «stages» are the year's pages
# without a group (the knockout rounds, or the whole tournament on one page). A title Wikipedia does not have is skipped.
tournaments:
  - {groups: "{y} FIFA World Cup Group {g}", letters: ABCDEFGH, stages: ["{y} FIFA World Cup knockout stage"],
     years: [2002, 2006, 2010, 2014, 2018, 2022]}
  - {groups: "UEFA Euro {y} Group {g}", letters: ABCD, stages: ["UEFA Euro {y} knockout stage"], years: [2008, 2012]}
  - {groups: "UEFA Euro {y} Group {g}", letters: ABCDEF, stages: ["UEFA Euro {y} knockout stage"], years: [2016, 2020, 2024]}
  - {groups: "{y} AFC Asian Cup Group {g}", letters: ABCD, stages: ["{y} AFC Asian Cup knockout stage"], years: [2011, 2015]}
  - {groups: "{y} AFC Asian Cup Group {g}", letters: ABCDEF, stages: ["{y} AFC Asian Cup knockout stage"], years: [2019, 2023]}
  - {groups: "{y} Africa Cup of Nations Group {g}", letters: ABCD, stages: ["{y} Africa Cup of Nations knockout stage"], years: [2010, 2012, 2013, 2015, 2017]}
  - {groups: "{y} Africa Cup of Nations Group {g}", letters: ABCDEF, stages: ["{y} Africa Cup of Nations knockout stage"], years: [2019, 2021, 2023]}
  - {groups: "{y} Copa América Group {g}", letters: ABC, stages: ["{y} Copa América knockout stage"], years: [2011, 2015, 2019]}
  - {groups: "Copa América Centenario Group {g}", letters: ABCD, stages: ["Copa América Centenario knockout stage"], years: [2016]}
  - {groups: "{y} Copa América Group {g}", letters: AB, stages: ["{y} Copa América knockout stage"], years: [2021]}
  - {groups: "{y} Copa América Group {g}", letters: ABCD, stages: ["{y} Copa América knockout stage"], years: [2024]}
  - {groups: "{y} FIFA Arab Cup Group {g}", letters: ABCD, stages: ["{y} FIFA Arab Cup knockout stage"], years: [2021, 2025]}
  - {groups: "{y} FIFA Confederations Cup Group {g}", letters: AB, stages: ["{y} FIFA Confederations Cup knockout stage"], years: [2005, 2009, 2013, 2017]}
  - {stages: ["{y} FIFA Club World Cup"], years: [2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023]}
  - {groups: "{y} FIFA Club World Cup Group {g}", letters: ABCDEFGH, stages: ["{y} FIFA Club World Cup knockout stage"], years: [2025]}
  - {groups: "{y} Arabian Gulf Cup Group {g}", letters: AB, stages: ["{y} Arabian Gulf Cup knockout stage"], years: [25th]}   # the editions before print none

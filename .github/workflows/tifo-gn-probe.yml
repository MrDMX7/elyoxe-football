# Temporary (articles Phase 2a, Task 10): can GitHub's servers decode Google News links and read the outlets' pages? Runs only
# by hand, reads the journal state, prints counts and nothing else, publishes nothing. Removed after one run.
name: Tifo news sources probe
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
env:
  TZ: Asia/Dubai
  PYTHONIOENCODING: utf-8
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tifo-setup
      - name: Read the sources of the 10 biggest stories
        run: |
          python - <<'EOF'
          import json, time
          from datetime import datetime, timezone
          from store import Store, S3Backend
          from news.articles import run as R, news_pick as N, sources as SRC
          j = Store(S3Backend(R.BUCKET)).get_state("news/state.json")
          tj = Store(S3Backend(R.BUCKET)).get_json("teams.json") or {}
          teams = tj.get("teams", tj); now = datetime.now(timezone.utc); it = j["items"]
          el = [s for s in j["stories"].values() if N.eligible(s, teams, j.get("pteam") or {}, now, items=it)]
          el.sort(key=lambda s: N.rank_key(s, it, teams), reverse=True)
          tot = {"links": 0, "decoded": 0, "texts": 0, "google": 0, "images": 0}
          for s in el[:10]:
              t0 = time.time()
              got, n = SRC.collect(s, it)
              g = sum(1 for i in s["items"] if "news.google.com" in (it.get(i) or {}).get("url", ""))
              for k in n: tot[k] += n[k]
              tot["google"] += min(g, 5); tot["images"] += sum(1 for x in got if x.get("image"))
              print(json.dumps({"story": s["id"], "kind": s["kind"], **n, "images": sum(1 for x in got if x.get("image")),
                                "secs": round(time.time() - t0, 1), "lens": [len(x["text"]) for x in got]}))
          print(json.dumps({"total": tot}))
          EOF

# «Tifo journal», every 15 minutes (was the laptop's Task Scheduler until 2026-10-23): python -m tools.runner journal — news,
# goal videos and commentators (news.run), the followed players' map (pushplayers), club transfer alerts (pushtransfers) and
# the day's Bing submission. Its small state (news/.cache: the YouTube «seen» list and FotMob's Arabic names; Bing's sent
# list) is one tar in S3 between runs (tools/ci_bridge.py state-get/put). The X inbox it reads is still filled by the
# laptop's «Tifo X reader» (S3 state/news/x-inbox.json).
name: Tifo journal
on:
  schedule:
    - cron: "5,20,35,50 * * * *"
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
concurrency:
  group: tifo-journal
  cancel-in-progress: false
env:
  TZ: Asia/Dubai
  PYTHONIOENCODING: utf-8
jobs:
  journal:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tifo-setup
      - name: State from the last run
        run: python -m tools.ci_bridge state-get journal .
      - name: Run the journal job
        run: python -m tools.runner journal
      - name: Log
        if: always()
        run: tail -c 12000 site/cache/runner/journal.log || true
      - name: State for the next run
        if: success() || failure()
        run: python -m tools.ci_bridge state-put journal . news/.cache site/cache/bing_sent.json
      # Tifo articles (match reports, then news): after the journal's state is saved, so a slow API never costs the journal its
      # state. Reports start no new match after 6 minutes, news no new story after 8 (news/articles/run.py); state is saved after each.
      - name: Tifo articles
        if: success() || failure()
        continue-on-error: true
        timeout-minutes: 10
        run: python -m news.articles.run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # the article pages written or changed this run, /news/ and the news sitemap, up within the minute from the full build's
      # shells (news/articles/pages.py, spec 2026-11-19 §7); the hourly build no longer publishes these paths
      - uses: actions/setup-node@v4
        if: success() || failure()
        with:
          node-version: "24"
      - name: Article pages
        if: success() || failure()
        continue-on-error: true
        timeout-minutes: 5
        run: python -m news.articles.pages
      - name: Articles in Google (weekly)
        if: success() || failure()
        continue-on-error: true
        timeout-minutes: 3
        run: python -m tools.gsc_weekly
        env:
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
          GSC_SITE: sc-domain:elyoxe.com
      - name: Usage lines for the laptop's cost report
        if: always()
        run: python -m tools.ci_bridge usage || true

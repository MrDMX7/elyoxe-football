# THROWAWAY spike (2026-11-18), never merged: can a runner download Tifo's goal clips and render one TifoGoal?
# Runs on a push to the goal-render-spike branch only. No AWS, no secrets: the render reads the old public Lambda site
# (sites/tifo-goal, Remotion 4.0.526) and gets the clip from a local server.
# v2: X 5/5, YouTube 0/5. Remotion's own ffmpeg has no fps filter (goal_moment needs it). v3: apt ffmpeg again, non-interactive,
# with a timeout (v1's apt-get hung 11 min with no output).
name: Tifo goal render spike
on:
  push:
    branches: [goal-render-spike]
permissions:
  contents: read
jobs:
  spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SERVE: https://remotionlambda-apsouth1-f5deu1gkph.s3.ap-south-1.amazonaws.com/sites/tifo-goal/index.html
      DEBIAN_FRONTEND: noninteractive
      NEEDRESTART_MODE: a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: apt ffmpeg (timed, 5 min cap)
        timeout-minutes: 7
        continue-on-error: true
        run: |
          t0=$(date +%s); sudo -E timeout 150 apt-get update -o Acquire::Retries=2 -o Dpkg::Use-Pty=0 | tail -3; echo "apt update: $(( $(date +%s)-t0 )) s" | tee -a "$GITHUB_STEP_SUMMARY"
          t0=$(date +%s); sudo -E timeout 300 apt-get install -y --no-install-recommends -o Dpkg::Use-Pty=0 ffmpeg | tail -3; echo "apt install ffmpeg: $(( $(date +%s)-t0 )) s" | tee -a "$GITHUB_STEP_SUMMARY"
          ffmpeg -hide_banner -version | head -1
      - name: Remotion 4.0.526 (timed)
        timeout-minutes: 6
        run: |
          mkdir -p /tmp/r && cd /tmp/r && npm init -y >/dev/null
          t0=$(date +%s); npm i --no-audit --no-fund --silent @remotion/cli@4.0.526 remotion@4.0.526 react@19.1.1 react-dom@19.1.1; echo "npm i: $(( $(date +%s)-t0 )) s" | tee -a "$GITHUB_STEP_SUMMARY"
          t0=$(date +%s); npx remotion browser ensure >/dev/null; echo "browser ensure: $(( $(date +%s)-t0 )) s" | tee -a "$GITHUB_STEP_SUMMARY"
          command -v ffmpeg || { comp=$(dirname "$(find /tmp/r/node_modules/@remotion -maxdepth 2 -name ffmpeg -type f | head -1)"); echo "$comp" >> "$GITHUB_PATH"; echo "LD_LIBRARY_PATH=$comp:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"; echo "using Remotion's ffmpeg"; }
      - name: One X clip (timed)
        timeout-minutes: 3
        run: |
          python -m pip install -q -U "yt-dlp[default]"
          mkdir -p dl && t0=$(date +%s.%N)
          yt-dlp --no-warnings --no-progress -f "best[ext=mp4]/best" -o dl/0.mp4 https://x.com/thmanyahsports/status/2123080008675508376
          echo "yt-dlp X clip: $(python -c "import time;print(round(time.time()-$t0,1))") s, $(du -m dl/0.mp4 | cut -f1) MB" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Render one TifoGoal (default concurrency, then all cores)
        timeout-minutes: 15
        run: |
          mkdir -p serve && t0=$(date +%s.%N)
          ffmpeg -v error -y -ss 20 -i dl/0.mp4 -t 12 -vf scale=1280:-2 -c:v libx264 -preset veryfast -crf 20 -c:a aac -b:a 128k -ar 48000 serve/clip.mp4
          echo "ffmpeg 12 s cut: $(python -c "import time;print(round(time.time()-$t0,1))") s" | tee -a "$GITHUB_STEP_SUMMARY"
          if ffmpeg -hide_banner -filters 2>/dev/null | grep -q " fps "; then t0=$(date +%s.%N); ffmpeg -v error -y -i dl/0.mp4 -t 60 -vf fps=0.5,scale=384:-2 -q:v 6 serve/f%03d.jpg; echo "vision frames (fps filter): $(ls serve/*.jpg | wc -l) in $(python -c "import time;print(round(time.time()-$t0,1))") s" | tee -a "$GITHUB_STEP_SUMMARY"; fi
          (cd serve && python -m http.server 8765 >/dev/null 2>&1 &)
          sleep 1
          cp spike/props.json /tmp/r/props.json && cd /tmp/r
          for c in "" "--concurrency=100%"; do
            t0=$(date +%s.%N)
            npx remotion render "$SERVE" TifoGoal out.mp4 --props=props.json --codec=h264 --crf=20 --timeout=240000 --log=error $c
            t1=$(date +%s.%N)
            s=$(python -c "print(round($t1-$t0,1))"); mb=$(python -c "import os;print(round(os.path.getsize('out.mp4')/1e6,2))")
            d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 out.mp4)
            echo "render ${c:-default}: ${s} s, ${mb} MB, ${d} s long" | tee -a "$GITHUB_STEP_SUMMARY"
            cp out.mp4 "$GITHUB_WORKSPACE/render${c:+-all}.mp4"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-render
          path: render*.mp4
          retention-days: 1

# THROWAWAY spike (2026-11-18), never merged: can a runner download Tifo's goal clips and render one TifoGoal?
# Runs on a push to the goal-render-spike branch only. No AWS, no secrets.
# v2: X 5/5, YouTube 0/5; Remotion's own ffmpeg has no fps filter. v3: apt ffmpeg hit a 300 s cap (mirror at 480 kB/s);
# render 86 s (77 s on all cores). v4: ffmpeg from the imageio-ffmpeg wheel; the bundle as a local folder (the public Lambda
# site's files) with clip.mp4, crests and goal.json written into its public/tifogoal/, rendered by a list-argument
# subprocess with no shell from the Remotion folder, as goal_watch.render_local does on a runner. v5: index.html's
# absolute /sites/tifo-goal/ paths made relative (v4's render failed on them in prepareServer). v6: bundle.js.map too (v5:
# «ENOENT … /tmp/bundle/bundle.js.map»: the renderer opens it, so the kit keeps the source maps).
name: Tifo goal render spike
on:
  push:
    branches: [goal-render-spike]
permissions:
  contents: read
jobs:
  spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SITE: https://remotionlambda-apsouth1-f5deu1gkph.s3.ap-south-1.amazonaws.com/sites/tifo-goal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: ffmpeg from imageio-ffmpeg, yt-dlp (timed)
        timeout-minutes: 4
        run: |
          t0=$(date +%s); python -m pip install -q -U imageio-ffmpeg "yt-dlp[default]"; echo "pip imageio-ffmpeg + yt-dlp: $(( $(date +%s)-t0 )) s" | tee -a "$GITHUB_STEP_SUMMARY"
          exe=$(python -c "import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())"); mkdir -p ~/bin && ln -sf "$exe" ~/bin/ffmpeg && echo "$HOME/bin" >> "$GITHUB_PATH"
          ~/bin/ffmpeg -hide_banner -version | head -1 | tee -a "$GITHUB_STEP_SUMMARY"
          ~/bin/ffmpeg -hide_banner -filters 2>/dev/null | grep -E " (fps|scale) "; ~/bin/ffmpeg -hide_banner -encoders 2>/dev/null | grep -E "libx264|mjpeg| aac"
      - name: Remotion 4.0.526 and the bundle folder
        timeout-minutes: 5
        run: |
          mkdir -p /tmp/r && cd /tmp/r && npm init -y >/dev/null
          npm i --no-audit --no-fund --silent @remotion/cli@4.0.526 remotion@4.0.526 react@19.1.1 react-dom@19.1.1 && npx remotion browser ensure >/dev/null
          mkdir -p /tmp/bundle/public/tifogoal && cd /tmp/bundle
          for f in 155 161 18 208 226 304 328 353 434 5 617 624 63 663 687 728 761 832 845 872 892 938 986; do curl -fsS -o "$f.bundle.js" "$SITE/$f.bundle.js"; done
          for f in bundle.js bundle.js.map favicon.ico index.html public/tifogoal/outro-v2.mp4 public/tifogoal/sting.wav; do curl -fsS -o "$f" "$SITE/$f"; done
          # the Lambda site was bundled for /sites/tifo-goal/; goal_watch's own bundle (and so the kit's) uses ./ (as here)
          sed -i -e 's#remotion_staticBase = "/sites/tifo-goal/public"#remotion_staticBase = new URL("./public", window.location.href).pathname#' -e 's#remotion_publicPath = "/sites/tifo-goal/"#remotion_publicPath = "./"#' -e 's#"/sites/tifo-goal/#"./#g' index.html
          grep -oE 'remotion_(staticBase|publicPath) = [^;]{0,70}|src="[^"]*"' index.html
          du -sh /tmp/bundle
      - name: goal_watch's steps for one X goal (timed)
        timeout-minutes: 15
        run: |
          python - <<'EOF'
          import json, os, subprocess, tempfile, time, urllib.request
          from pathlib import Path
          T = {}
          def t(k, t0): T[k] = round(time.time() - t0, 1)
          pub = Path("/tmp/bundle/public/tifogoal"); raw = Path("dl/x.mp4"); raw.parent.mkdir(exist_ok=True)
          t0 = time.time()
          subprocess.run(["yt-dlp", "-q", "--no-warnings", "-f", "best[ext=mp4]/best", "-o", str(raw), "https://x.com/thmanyahsports/status/2123080008675508376"], check=True, timeout=600)
          t("download", t0)
          d = tempfile.mkdtemp(prefix="gm-"); t0 = time.time()
          subprocess.run(["ffmpeg", "-v", "error", "-y", "-i", str(raw), "-t", "60", "-vf", "fps=0.5,scale=384:-2", "-q:v", "6", os.path.join(d, "f%03d.jpg")], check=True)
          t("vision frames", t0); T["frames"] = len(os.listdir(d))
          t0 = time.time()
          subprocess.run(["ffmpeg", "-v", "error", "-y", "-ss", "36.00", "-i", str(raw), "-t", "12", "-vf", "scale=1280:-2", "-c:v", "libx264", "-preset", "veryfast",
                          "-crf", "20", "-c:a", "aac", "-b:a", "128k", "-ar", "48000", str(pub / "clip.mp4")], check=True)
          t("12 s cut", t0)
          for side, tid in (("h", 582816), ("a", 463259)):
              urllib.request.urlretrieve(f"https://images.fotmob.com/image_resources/logo/teamlogo/{tid}.png", pub / f"{side}.png")
          g = json.load(open("spike/props.json", encoding="utf-8"))
          for k in ("clipUrl", "hUrl", "aUrl"): g.pop(k)
          (pub / "goal.json").write_text(json.dumps(g, ensure_ascii=False), encoding="utf-8")
          pj = Path("/tmp/props.json"); pj.write_text(json.dumps(g, ensure_ascii=False), encoding="utf-8")
          mp4 = Path(os.environ["GITHUB_WORKSPACE"]) / "render.mp4"; t0 = time.time()
          r = subprocess.run(["npx", "remotion", "render", "/tmp/bundle", "TifoGoal", str(mp4), f"--props={pj}", "--codec=h264", "--crf=20",
                              "--timeout=240000", "--log=error"], cwd="/tmp/r", capture_output=True, text=True, timeout=1800, shell=False)
          t("render", t0); T["render rc"] = r.returncode; T["MB"] = round(mp4.stat().st_size / 1e6, 2) if mp4.exists() else 0
          print((r.stdout + r.stderr)[:1500])
          line = " · ".join(f"{k}: {v}" for k, v in T.items())
          print(line); open(os.environ["GITHUB_STEP_SUMMARY"], "a").write("goal_watch steps: " + line + "\n")
          assert mp4.exists() and mp4.stat().st_size > 100_000
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-render
          path: render*.mp4
          retention-days: 1

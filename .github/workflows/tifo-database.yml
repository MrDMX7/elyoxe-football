# «Tifo database», daily at 04:10 UAE (00:10 UTC; was the laptop's Task Scheduler at 04:30 until 2026-10-23): python -m db.refresh —
# each stage when its turn comes (FotMob, 365Scores, Transfermarkt datasets, Wikidata/Wikipedia, Understat, Elo, EA FC…).
# db/.cache and history/.cache (1.9 GB) ride actions/cache; with none left, ci/seed/db-cache.tar from S3. Which stage ran
# when is shared with any other host through S3 (state/db/refresh.json), so the laptop and this never run a stage twice.
name: Tifo database
on:
  schedule:
    - cron: "10 0 * * *"        # ahead of the laptop's old 04:30, which finds the stages claimed and stops
  workflow_dispatch:
    inputs:
      force:
        description: stages to run even when not due (comma-separated, as db.refresh --force)
        default: ""
permissions:
  id-token: write
  contents: read
  actions: write                  # prunes this job's older caches
concurrency:
  group: tifo-database
  cancel-in-progress: false
env:
  TZ: Asia/Dubai
  PYTHONIOENCODING: utf-8
jobs:
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tifo-setup
        with:
          session-seconds: "21600"
      - run: python -m pip install --quiet --disable-pip-version-check -r requirements-db.txt
      - name: Restore the database caches
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            db/.cache
            history/.cache
          key: tifo-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: tifo-db-
      - name: No cache left, so the seed from S3
        if: steps.cache.outputs.cache-matched-key == ''
        run: python -m tools.ci_bridge seed-get db
      - name: Run the database refresh
        timeout-minutes: 320
        run: python -m db.refresh ${{ inputs.force && format('--force {0}', inputs.force) || '' }}
      - name: Save the database caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            db/.cache
            history/.cache
          key: tifo-db-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Keep the newest two caches of this job
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache list -R "$GITHUB_REPOSITORY" --key tifo-db- --sort created_at --order desc --limit 50 --json id --jq '.[2:][].id' | xargs -r -n1 gh cache delete -R "$GITHUB_REPOSITORY"

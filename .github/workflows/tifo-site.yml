# «Tifo site», hourly at :25 UAE (was the laptop's Task Scheduler until 2026-10-23): python -m tools.runner site — AI texts
# (site/ai/gen.py, Gemini), the build (site/build.cjs), the partial-build guard, the S3 publish, CloudFront, IndexNow, health.
# site/cache (1.1 GB of manifests and caches the next build needs) rides actions/cache under a rolling key; when no cache is
# left (first run, or 7 days without a run) it starts from s3://…/ci/seed/site-cache.tar instead. The guard holds every build
# against the last published page count in S3 state, so a cold or partial cache can never publish a short site.
name: Tifo site
on:
  # schedule:            (on once the dispatch runs are green)
  #   - cron: "25 * * * *"          # every hour at :25 (UTC and UAE share the minutes)
  workflow_dispatch:
permissions:
  id-token: write                 # AWS by OIDC
  contents: read
  actions: write                  # prunes this job's older caches (with the database job's, under the 10 GB a repo gets)
concurrency:
  group: tifo-site
  cancel-in-progress: false       # a slow build finishes; the next one waits (one queued at most)
env:
  TZ: Asia/Dubai                  # the jobs' «today» is the UAE day, as on the laptop
  PYTHONIOENCODING: utf-8
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # site/ai/gen.py (Gemini 3.1 Flash-Lite, ai/provider.json)
jobs:
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tifo-setup
        with:
          session-seconds: "14400"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: esbuild (the laptop's version, so the minified assets hash the same)
        run: |
          npm install --silent --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/esb" esbuild@0.28.1
          echo "ESBUILD=$RUNNER_TEMP/esb/node_modules/esbuild" >> "$GITHUB_ENV"
      - name: Pillow can shape Arabic (og.py uses RAQM)
        run: |
          python -c "from PIL import features; assert features.check('raqm')" 2>/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq libraqm0 libfribidi0 libharfbuzz0b; }
          python -c "from PIL import features; assert features.check('raqm'), 'no raqm'; print('raqm ok')"
      - name: Restore site/cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            site/cache
            !site/cache/runner
          key: tifo-site-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: tifo-site-
      - name: No cache left, so the seed from S3
        if: steps.cache.outputs.cache-matched-key == ''
        run: python -m tools.ci_bridge seed-get
      - name: Run the site job
        id: job
        run: python -m tools.runner site
      - name: Log
        if: always()
        run: tail -c 30000 site/cache/runner/site.log || true
      - name: Gemini usage lines for the laptop's cost report
        if: always()
        run: python -m tools.ci_bridge usage || true
      - name: Save site/cache
        if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: |
            site/cache
            !site/cache/runner
          key: tifo-site-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Keep the newest two caches of this job
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache list -R "$GITHUB_REPOSITORY" --key tifo-site- --sort created_at --order desc --limit 50 --json id --jq '.[2:][].id' | xargs -r -n1 gh cache delete -R "$GITHUB_REPOSITORY"

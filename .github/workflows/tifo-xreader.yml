# «Tifo X reader» on GitHub Actions (trial, 2026-10-24; was the laptop's Task Scheduler): news/xreader.js in Google Chrome on Xvfb,
# headful, read-only, with the @Elyoxe session from the X_COOKIES secret (the laptop profile's x-cookies.json). The inbox and the
# shared rate-limit rest live in S3 between runs (state/news/x-inbox.json, state/news/x-cooldown.json). Started by the AWS ticker;
# the reader itself decides whether a run is due (min_minutes / live_minutes in news/sources.yaml) before it opens a browser.
name: Tifo X reader
on:
  workflow_dispatch:
    inputs:
      args:
        description: extra xreader.js arguments (e.g. --handles TheAFCCL_ar --dry)
        default: ""
permissions:
  id-token: write
  contents: read
concurrency:
  group: tifo-xreader
  cancel-in-progress: false
env:
  TZ: Asia/Dubai
  XREADER_CHROME: /usr/bin/google-chrome
  BUCKET: elyoxe-football-574771023173-ap-south-1
jobs:
  xreader:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::574771023173:role/tifo-github-actions
          aws-region: ap-south-1
          role-duration-seconds: 900
      - name: Browser bits
        run: |
          command -v Xvfb >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq xvfb >/dev/null; }
          npm install --no-save --no-audit --no-fund --silent playwright-core
      - name: Session and state
        env:
          X_COOKIES: ${{ secrets.X_COOKIES }}
        run: |
          P="$HOME/workspace/automation/browse/profiles/x-reader"; mkdir -p "$P"
          printf '%s' "$X_COOKIES" > "$P/x-cookies.json"
          aws s3 cp "s3://$BUCKET/state/news/x-inbox.json" news/.x-inbox.json --only-show-errors || true
          aws s3 cp "s3://$BUCKET/state/news/x-cooldown.json" news/.x-cooldown.json --only-show-errors || true
      - name: Read X
        run: node news/xreader.js --upload ${{ inputs.args }}
      - name: Rest state for the next run
        if: always()
        run: |
          [ -f news/.x-cooldown.json ] && aws s3 cp news/.x-cooldown.json "s3://$BUCKET/state/news/x-cooldown.json" --only-show-errors || true
